<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>四国ドライブ 2027.3.8–3.11</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--bg:#0b0f17;--pn:rgba(13,17,27,.94);--ln:#283246;--tx:#e9eef6;--mu:#8f9cb2;--hw:#ffb547;--lc:#3fe0c5;--mc:var(--hw);--ng:#ff7070;--ok:#62d692;--q:#ffd166;--fe:#8fd3ff;--sv:118px;--th:150px}
body.local{--mc:var(--lc)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:#1a2132;border:1px solid var(--ln);border-radius:10px;padding:5px 10px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.3;cursor:default}
button.pri{background:var(--mc);border-color:var(--mc);color:#111;font-weight:700}
a{color:#9fc6ff}
.mu{color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,#888);flex:none}
#map{position:fixed;inset:0;background:#0b0f17}
/* 上 */
#top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 8px) 10px 16px;background:linear-gradient(#070a10f5 70%,#070a1000);pointer-events:none}
#top>*{pointer-events:auto}
.tl{display:flex;align-items:center;gap:8px}
h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
h1 small{font-size:11px;color:var(--mu);font-weight:400;margin-left:6px}
#me{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;max-width:40%}
#upd{font-size:11px;color:var(--mu);min-height:16px;display:flex;gap:10px;white-space:nowrap;overflow:hidden}
#days{display:flex;gap:6px;margin-top:4px}
#days button{flex:1;padding:4px 0 3px;border-radius:12px;background:#121826d9;line-height:1.15;position:relative}
#days b{display:block;font-size:15px}
#days small{font-size:11px;color:var(--mu)}
#days button.on{background:#1f2738;border-color:var(--mc);box-shadow:inset 0 -3px 0 var(--mc)}
#days em{position:absolute;right:4px;top:2px;font-style:normal;font-size:10px;color:var(--q)}
#modes{display:flex;margin-top:6px;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#121826d9}
#modes button{flex:1;border:0;border-radius:0;background:none;padding:5px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
#modes b{font-size:13px}
#modes small{font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}
#modes button.on[data-m=highway]{background:var(--hw);color:#1d1400}
#modes button.on[data-m=local]{background:var(--lc);color:#002520}
#toast{position:fixed;left:50%;top:calc(var(--th) + 4px);transform:translate(-50%,-8px);z-index:1003;background:#141b2a;border:1px solid var(--mc);border-radius:12px;padding:7px 12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 6px 20px #000a}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 計器 */
#dock{position:fixed;left:8px;right:8px;bottom:calc(var(--sv) + 8px);z-index:1001;transition:bottom .25s,opacity .2s}
body.sfull #dock{opacity:0;pointer-events:none}
#hud{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:6px 10px 4px;display:grid;grid-template-columns:46px 1fr auto;gap:1px 10px;align-items:center;box-shadow:0 8px 26px #000a}
#play{width:46px;height:46px;border-radius:50%;background:var(--mc);border:0;color:#111;font-size:19px;grid-column:1;grid-row:1/span 4;padding:0;box-shadow:0 0 16px color-mix(in srgb,var(--mc) 55%,transparent)}
.hc{grid-column:2;display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.hc small{font-size:10px;color:var(--mu)}
#clkb{font-size:22px;font-weight:800;color:var(--mc);font-variant-numeric:tabular-nums;text-shadow:0 0 12px color-mix(in srgb,var(--mc) 60%,transparent)}
#odo{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
#odo b{color:var(--tx);font-size:13px;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column;gap:3px;grid-column:3;grid-row:1/span 4}
.hb button{padding:2px 7px;font-size:12px;border-radius:8px}
.sr{grid-column:2;display:grid;grid-template-columns:40px 1fr auto;gap:6px;align-items:center;font-size:12px;line-height:1.25;opacity:.72}
.sr.on{opacity:1}
.tg{display:block;padding:0 0 0 6px;font-size:11px;font-weight:900;color:#06101f;transform:skewX(-12deg);border-radius:2px}
.sr[data-m=highway] .tg{background:var(--hw)}.sr[data-m=local] .tg{background:var(--lc)}
.ss{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sr.gl .ss{color:var(--ok);font-weight:700}
.ae{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ae small{font-size:10px;font-weight:400;color:var(--mu);margin-left:1px}
.ae.nx{color:var(--q)}
.df{grid-column:2;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--q);min-width:0}
.df b{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud.fin .df b{animation:fin .5s 3}
@keyframes fin{50%{opacity:.2}}
.carw .lb{position:absolute;left:50%;transform:translateX(-50%) skewX(-10deg);top:-14px;font-size:10px;font-weight:900;line-height:14px;padding:0 4px;border-radius:2px;color:#06101f;white-space:nowrap;background:var(--cc)}
.carw.sec .car{transform:scale(.8);opacity:.85}
.carw.sec .lb{top:auto;bottom:-12px}
#prog{flex:1;min-width:90px;height:16px;position:relative;cursor:pointer;touch-action:none}
#prog i{position:absolute;top:7px;height:3px;border-radius:2px}
#prog .bar{left:0;right:0;background:#2a3346}
#prog .fill{left:0;background:var(--mc)}
#prog .tk{top:4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#0b0f17;border:2px solid #cfd8e6}
#prog .tk.nx{border-color:var(--q)}
#arr{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--mc);border-radius:14px;padding:9px 12px;opacity:0;transform:translateY(16px) scale(.96);transition:opacity .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none;box-shadow:0 10px 30px #000b}
#arr.on{opacity:1;transform:none;pointer-events:auto}
.ah{display:flex;gap:8px;align-items:center}
.ah b{font-size:15px}
.ah small{display:block;color:var(--mu);font-size:12px}
.nd{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#0b0f17;border:2.5px solid var(--mc)}
/* シート */
#sheet{position:fixed;left:0;right:0;bottom:0;height:88vh;height:88dvh;z-index:1002;background:#0e131e;border-top:1px solid var(--ln);border-radius:18px 18px 0 0;transform:translateY(calc(100% - var(--sv)));transition:transform .25s;display:flex;flex-direction:column;box-shadow:0 -10px 30px #0009}
#sheet.drag{transition:none}
#grab{padding:6px 14px 4px;touch-action:none;cursor:grab;user-select:none}
#grab>i{display:block;width:42px;height:4px;border-radius:2px;background:#3a4558;margin:0 auto 6px}
#sum{font-size:13px;display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden}
#sum b{font-size:15px}
#tabs{display:flex;gap:3px;padding:5px 6px 6px;border-bottom:1px solid var(--ln)}
#tabs button{flex:1;padding:6px 0;font-size:12.5px;border-radius:10px;background:none;border-color:transparent;white-space:nowrap;position:relative}
#tabs button.on{background:#1f2738;border-color:var(--ln)}
#tabs em{font-style:normal;font-size:10px;background:var(--mc);color:#111;border-radius:8px;padding:0 5px;margin-left:2px}
#body{flex:1;overflow:auto;padding:10px 12px 60px;overscroll-behavior:contain}
/* 行程 */
.ub{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.ub span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{background:#151c2b;border-radius:12px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.wa{background:#2a1e0c;border:1px solid #6b4a12;color:#ffd99a;border-radius:12px;padding:7px 10px;font-size:13px;margin-bottom:8px}
.st{display:grid;grid-template-columns:58px 28px 1fr;gap:0 6px;padding:6px 0;border-radius:10px;cursor:pointer}
.st.fl{animation:fl 2.4s}
@keyframes fl{0%,40%{background:color-mix(in srgb,var(--mc) 22%,transparent)}100%{background:transparent}}
.tc{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15;padding-top:2px}
.tc b{font-size:16px}
.tc small{display:block;font-size:11px;color:var(--mu)}
.tc.nx b{color:var(--q);font-size:14px;letter-spacing:-.03em}
.st .nd{margin-top:1px}
.st.s .nd,.st.e .nd{background:var(--mc);color:#111;border-color:var(--mc)}
.st.pr .nd{box-shadow:0 0 0 3px var(--pc)}
.nm{font-weight:600;font-size:14px;line-height:1.3}
.sb{font-size:12px;color:var(--mu);margin-top:1px}
.ctl{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}
.ctl button{padding:2px 9px;font-size:13px;border-radius:8px;min-width:30px}
.ctl .sy{display:flex;align-items:center;gap:4px;margin-right:auto}
.ctl .sy b{font-size:13px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.ctl input{font:inherit;background:#1a2132;color:inherit;border:1px solid var(--ln);border-radius:8px;padding:2px 6px;color-scheme:dark}
.dv{display:grid;grid-template-columns:58px 28px 1fr;gap:0 6px;font-size:12px;color:var(--mu);min-height:26px;align-items:center}
.dv i{justify-self:center;width:4px;height:100%;min-height:26px;border-radius:2px;background:var(--mc);opacity:.7}
.dv.fe i{background:repeating-linear-gradient(var(--fe) 0 4px,transparent 4px 8px)}
.dv.pd i{background:repeating-linear-gradient(var(--mc) 0 4px,transparent 4px 8px);animation:dvp 1s linear infinite}
@keyframes dvp{to{background-position:0 8px}}
.b{display:inline-block;font-size:11px;font-weight:600;border-radius:7px;padding:0 6px;margin-left:4px;vertical-align:1px;white-space:nowrap;border:1px solid}
.b.ok{color:var(--ok);border-color:#2f6b49}
.b.ng{color:var(--ng);border-color:#7a3434}
.b.q{color:var(--q);border-color:#7a6326}
.b.fe{color:var(--fe);border-color:#2f5d7a}
.b.by{color:var(--pc);border-color:var(--pc)}
.b.sp{color:var(--mc);border-color:var(--mc)}
.b.sp:before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}
.tot{display:flex;flex-wrap:wrap;gap:4px 14px;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px;font-size:13px}
.tot b{font-size:15px;font-variant-numeric:tabular-nums}
.sec{margin-top:14px}
.sec h3{font-size:13px;margin:0 0 6px;color:var(--mu);font-weight:600}
.nl{margin:0;padding-left:18px;font-size:12.5px}
.nl li{margin-bottom:4px}
.alt{background:#161a2e;border:1px solid #3a3f6b;border-radius:12px;padding:9px 11px;font-size:13px;margin-top:10px}
.alt table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px;font-variant-numeric:tabular-nums}
.alt td,.alt th{padding:3px 4px;border-bottom:1px solid #2a2f52;text-align:right}
.alt td:first-child,.alt th:first-child{text-align:left}
.lg{font-size:12px}
.lg div{padding:3px 0;border-bottom:1px solid #1b2232}
details{font-size:12.5px;margin-top:12px}
summary{cursor:pointer;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{font-size:12px;padding:3px 9px;border-radius:999px}
/* カード */
.cc{background:#131a28;border:1px solid var(--ln);border-radius:14px;padding:9px 11px;margin-bottom:9px}
.ch{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.ch b{font-size:14.5px}
.ic{font-size:14px}
.m{font-size:12px;color:var(--mu);margin:2px 0 4px}
.kv{font-size:12.5px;margin:1px 0}
.kv span{display:inline-block;min-width:36px;color:var(--mu);font-size:11px}
.why{font-size:12.5px;margin-top:4px}
.nt{font-size:12px;color:#c9b98a;margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.acts button,.acts a{font-size:12.5px;padding:4px 10px;border-radius:9px}
.acts a{border:1px solid #2c4568;text-decoration:none}
.acts .on{background:#2a3550;border-color:var(--mc)}
.inp{font-size:12px;color:var(--ok)}
.uz{margin-top:6px;font-size:11.5px}
.uzb{position:relative;height:14px;background:#1b2232;border-radius:7px;overflow:hidden}
.uzb i{position:absolute;top:0;bottom:0;background:#1f5d76}
.uzb b{position:absolute;top:2px;bottom:2px;background:var(--mc);border-radius:4px;min-width:4px}
.uzl{position:relative;height:13px;color:var(--mu);font-size:10px}
.uzl span{position:absolute;transform:translateX(-50%)}
.sea{background:#121c26;border:1px solid #23415a;border-radius:12px;padding:8px 10px;margin-bottom:9px;font-size:12.5px}
.sea b{color:#ffc2d4}
/* 提案（付箋） */
.stk{display:flex;flex-wrap:wrap;gap:14px 10px;padding:10px 2px 4px}
.sticky{position:relative;width:calc(50% - 5px);min-height:132px;padding:15px 10px 8px;background:color-mix(in srgb,var(--pc) 20%,#fffdf3);color:#2b2a26;box-shadow:0 3px 8px #0007;border-radius:2px 2px 12px 2px;font-size:12.5px;transform:rotate(var(--rot,-1deg))}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:15px;margin-left:-23px;background:#ffffffa6;transform:rotate(-3deg)}
.sticky .sh{display:flex;align-items:center;gap:5px;font-size:12px;color:color-mix(in srgb,var(--pc) 60%,#222);font-weight:700}
.sticky .sh i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.sticky .sh small{margin-left:auto;font-weight:400;color:#6b665c;font-size:10.5px;white-space:nowrap}
.sticky .sn{font-weight:700;font-size:13.5px;line-height:1.35;margin:4px 0 2px}
.sticky .sc{font-size:13px;line-height:1.45;color:#3d3a34}
.sticky .sx{font-size:11px;color:#5d584e;margin-top:2px}
.sticky .sa{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.sticky .sa button{font-size:12px;border:1px solid #0002;background:#ffffffb3;color:#2b2a26;border-radius:6px;padding:3px 7px}
.sticky .sa button.on{background:#fff;border-color:var(--pc);font-weight:700}
.sticky .sa button.pri{background:#2b2a26;color:#fff;border-color:#2b2a26}
.sticky.declined{filter:grayscale(.85);opacity:.6}
.sticky .b{background:#fff8}
.stamp{position:absolute;right:8px;bottom:34px;font-weight:900;font-size:16px;line-height:1;letter-spacing:.15em;border:2.5px solid;border-radius:5px;padding:4px 5px 4px 7px;transform:rotate(-12deg);opacity:.9;color:#d9402b;pointer-events:none}
.declined .stamp{color:#555}
.sticky.new{display:grid;place-items:center;font-size:30px;color:var(--mu);background:transparent;border:2px dashed #3a4558;box-shadow:none;transform:none}
.sticky.new::before{display:none}
.dk .sticky{width:auto;min-height:0;transform:none;margin:4px 0 2px}
/* 間に合うか・変わった値 */
.ck{font-size:12px;font-weight:600;margin-top:2px}
.ck.ok{color:var(--ok)}.ck.ng{color:var(--ng)}.ck.wa{color:var(--q)}
.tv.chg{background:linear-gradient(transparent 55%,#ffd16673 55%);border-radius:2px}
.tv s{font-size:.75em;color:var(--mu);margin-right:4px;font-weight:400}
.tc .tv s{display:block;margin:0;font-size:11px;line-height:1.1}
.tv.pend{opacity:.5}
/* 全体（4日間の運転時間） */
.cl{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--mu);margin-bottom:6px}
.sw{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}
.sw.h,.cb.h i{background:var(--hw)}.sw.l,.cb.l i{background:var(--lc)}
.cg{position:relative;padding-bottom:18px}
.cax{position:absolute;left:62px;right:96px;top:0;bottom:0;pointer-events:none}
.cax i{position:absolute;top:0;bottom:16px;border-left:1px solid #1d2a47}
.cax span{position:absolute;bottom:0;transform:translateX(-50%);font-size:9.5px;color:var(--mu)}
.cr{position:relative;display:grid;grid-template-columns:62px 1fr;align-items:center;padding:5px 0;border-radius:6px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.cr.on{background:color-mix(in srgb,var(--mc) 10%,transparent)}
.cr.on .cdl{color:var(--mc)}
.cdl{font-size:12px;font-weight:800;line-height:1.15;padding-left:4px}
.cdl small{display:block;font-size:10px;font-weight:400;color:var(--mu)}
.cbs{display:block;position:relative;margin-right:96px}
.cb{display:block;position:relative;height:17px}
.cb i{position:absolute;left:0;top:6px;height:6px;border-radius:3px;transition:width .3s}
.cb>span{position:absolute;top:0;font-size:11px;white-space:nowrap;color:var(--tx)}
.dl{font-style:normal;font-size:10px;margin-left:3px;color:var(--q)}
.dl.dn{color:var(--ok)}
.ovt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:8px}
.ovt td,.ovt th{padding:4px 3px;border-bottom:1px solid #1d2638;text-align:right;white-space:nowrap}
.ovt th{font-size:11px;color:var(--mu);font-weight:600}
.ovt td:first-child,.ovt th:first-child{text-align:left}
.big{width:100%;padding:9px;border-radius:12px;font-size:14px;margin-bottom:10px;border-style:dashed}
#cfm .mb p{font-size:14px;margin:0 0 14px}
#cfm .mb div{display:flex;gap:8px}
h4{font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
/* 地図の上の印 */
.lw{background:none;border:0}
.pin{position:relative;width:40px;height:40px;display:grid;place-items:center}
.pin b{width:27px;height:27px;border-radius:50%;background:#0b0f17;border:3px solid var(--mc);display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:0 0 0 3px var(--pc,transparent),0 2px 8px #000c;transition:transform .15s}
.pin.s b,.pin.e b{background:var(--mc);color:#111}
.pin i{position:absolute;left:33px;top:10px;font-style:normal;font-size:11px;font-weight:600;background:#0b0f17e6;border:1px solid var(--ln);padding:0 5px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff}
.pin.l i{left:auto;right:33px}
.pin i.nx{color:var(--q);border-color:#7a6326}
.pin i.pd{color:var(--mu)}
.pin.fl i{animation:pfl 2.4s}
@keyframes pfl{0%,50%{background:var(--mc);color:#111}}
.lift .pin b{transform:scale(1.35) translateY(-6px);box-shadow:0 14px 18px #000d}
.cd{position:relative;width:28px;height:28px;display:grid;place-items:center;opacity:.62}
.cd span{width:24px;height:24px;border-radius:50%;background:#101624d9;border:1px dashed #7d8aa3;display:grid;place-items:center;font-size:12px}
.cd em{position:absolute;right:-4px;top:-4px;font-size:9px;background:#3a4558;border-radius:6px;padding:0 3px;font-style:normal}
.fl{position:relative}
.fl em{position:absolute;left:22px;top:-2px;font-size:10px;font-style:normal;background:#0b0f17e6;border-radius:7px;padding:0 4px;white-space:nowrap}
.fei span{display:inline-block;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;background:#0d2433e6;color:var(--fe);border:1px solid #2f5d7a;border-radius:8px;padding:1px 6px}

  refreshPop();sweepChg();}
function dayBounds(){const d=curDay(),sc=sched(d,S.mode),p=d.stops.map(s=>[s.lat,s.lon]);sc.legs.forEach(l=>{for(let i=0;i<l.L.path.length;i+=4)p.push(l.L.path[i]);});return L.latLngBounds(p);}
function fitDay(anim){const th=$('#top').offsetHeight;map.fitBounds(dayBounds(),{paddingTopLeft:[58,th+14],paddingBottomRight:[64,wide()?150:sheetPx()+$('#dock').offsetHeight+26],maxZoom:12,animate:!!anim});}
function setDay(i){if(i===S.day)return;pause();A.T=A.a=0;A.b=1;closePop();dropTmp();S.day=i;hashSync();renderAll();if(S.tab==='all')fitAll();else fitDay(true);}
function hashSync(){if(DEMO)return;history.replaceState(null,'','#day='+(S.day+1)+(S.mode==='local'?'&mode=local':''));}
function focusLL(ll){const z=Math.max(map.getZoom(),10),H=innerHeight,top=$('#top').offsetHeight,bot=wide()?0:sheetPx()+$('#dock').offsetHeight,vc=(top+H-bot)/2,p=map.project(ll,z).subtract([0,vc-H/2]);map.setView(map.unproject(p,z),z,{animate:true});}
/* シート */
function sheetPx(){if(wide())return 0;const H=innerHeight;return S.sv==='full'?Math.round(H*.86):S.sv==='half'?Math.round(H*.5):peekPx();}
function peekPx(){return $('#grab').offsetHeight+$('#tabs').offsetHeight+2;}
function setSheet(v){S.sv=v;document.documentElement.style.setProperty('--sv',sheetPx()+'px');document.body.classList.toggle('sfull',v==='full'&&!wide());}
(()=>{const g=$('#grab'),sh=$('#sheet');let y0=0,v0=0,dn=false,mv=0;
  g.addEventListener('pointerdown',e=>{if(wide())return;dn=true;mv=0;y0=e.clientY;v0=sheetPx();g.setPointerCapture(e.pointerId);sh.classList.add('drag');});
  g.addEventListener('pointermove',e=>{if(!dn)return;mv=Math.max(mv,Math.abs(e.clientY-y0));const v=Math.max(peekPx(),Math.min(innerHeight*.88,v0+y0-e.clientY));document.documentElement.style.setProperty('--sv',v+'px');});
  g.addEventListener('pointerup',e=>{if(!dn)return;dn=false;sh.classList.remove('drag');const H=innerHeight;if(mv<6){setSheet(S.sv==='peek'?'half':S.sv==='half'?'full':'peek');return;}
    const v=v0+y0-e.clientY,c=[['peek',peekPx()],['half',H*.5],['full',H*.86]];c.sort((a,b)=>Math.abs(a[1]-v)-Math.abs(b[1]-v));setSheet(c[0][0]);});})();
/* 名前 */
function askName(then){const m=$('#modal');m.innerHTML=`<div class="mb" style="--c:${S.me?colorOf(S.me):'#3a4558'}"><h2>${esc(D.title)}</h2><label for="nmIn">あなたの名前</label><input id="nmIn" maxlength="12" value="${esc(S.me)}" autocomplete="nickname"><button class="pri" data-a="nameOk">🚗 はじめる</button></div>`;m.classList.add('on');askName.then=then;const i=$('#nmIn');
  i.addEventListener('input',()=>m.firstChild.style.setProperty('--c',i.value.trim()?colorOf(i.value.trim()):'#3a4558'));i.addEventListener('keydown',e=>{if(e.key==='Enter')ACT.nameOk();});setTimeout(()=>i.focus(),50);}
/* 操作 */
const ACT={
  day:d=>setDay(+d.d),
  mode:d=>{if(S.mode===d.m)return;pause();S.mode=d.m;hashSync();renderAll();},
  tab:d=>{S.tab=d.t;if(S.sv==='peek')setSheet('half');renderSheet();$('#body').scrollTop=0;if(d.t==='all')fitAll();},
  reset:()=>askConfirm(S.store==='fs'?'みんなの計画を最初に戻します。よろしいですか？':'この端末に保存した計画を消して、最初の計画に戻します。よろしいですか？',resetPlan),
  cfmOk:()=>{$('#modal').classList.remove('on');const f=askConfirm.ok;askConfirm.ok=null;if(f)f();},
  cfmNo:()=>{$('#modal').classList.remove('on');askConfirm.ok=null;},
  play:()=>A.on?pause():play(),
  spd:()=>{A.spd=A.spd===1?3:A.spd===3?8:1;$('#spd').textContent='×'+A.spd;},
  fit:()=>fitDay(true),
  undo:()=>undo(),
  name:()=>askName(),
  nameOk:()=>{const v=($('#nmIn').value||'').trim().slice(0,12);if(!v)return;S.me=v;if(!MEM)LS.set('me',v);$('#modal').classList.remove('on');ensureMember();renderAll();const t=askName.then;askName.then=null;if(t)t();},
  stay:d=>{const j=+d.j,s=curDay().stops[j];if(!s)return;const v=Math.max(0,(s.stay||0)+ +d.d);edit(`${s.name}の滞在を${fmtD(v)}に`,pl=>{pl.days[S.day].stops[j].stay=v;});},
  mv:d=>{const j=+d.j,k=j+ +d.d,st=curDay().stops;if(k<1||k>=st.length)return;edit(`${st[j].name}の順番を入れ替えた`,pl=>{const a=pl.days[S.day].stops;[a[j],a[k]]=[a[k],a[j]];});},
  del:d=>{const j=+d.j,st=curDay().stops;if(st.length<=2||j<1)return;closePop();edit(`${st[j].name}を外した`,pl=>{pl.days[S.day].stops.splice(j,1);});},
  focus:d=>{const s=curDay().stops[+d.j];if(!s)return;focusLL([s.lat,s.lon]);openPop([s.lat,s.lon],()=>stopPop(+d.j));},
  retry:(d,b,e)=>{e.stopPropagation();const k=d.k.split('|');[...RC.keys()].forEach(x=>{const r=RC.get(x);if(r.est&&x.endsWith(k[1]+'|'+k[2]))RC.delete(x);});ensureRoutes();renderAll();},
  cadd:d=>{addCand(d.r);closePop();},
  cprop:d=>{const r=pref(d.r);if(!r)return;if(!wide())setSheet('peek');closePop();focusLL([r.o.lat,r.o.lon]);setTimeout(()=>openCmp(L.latLng(r.o.lat,r.o.lon),r.ref),350);},
  cfocus:d=>{const r=pref(d.r);if(!r||r.o.lat==null)return;focusLL([r.o.lat,r.o.lon]);openPop([r.o.lat,r.o.lon],()=>candHTML(pref(d.r),1));},
  newflag:()=>{if(!wide())setSheet('peek');const th=$('#top').offsetHeight,bot=wide()?0:sheetPx()+$('#dock').offsetHeight,sz=map.getSize();openCmp(map.containerPointToLatLng([sz.x/2,(th+sz.y-bot)/2]),null);},
  cmpProp:()=>{if(!tmp)return;const ll=tmp.getLatLng(),r=pref(tmp._ref),c=cmpVal('cm'),nm=r?r.o.name:cmpVal('nm')||'寄り道';
    PS.add({by:S.me,color:colorOf(S.me),lat:+ll.lat.toFixed(5),lon:+ll.lng.toFixed(5),name:nm,comment:c,ref:r?r.ref:null,votes:[],status:'open',createdAt:Date.now(),day:S.day+1});
    dropTmp();closePop();toast('🚩 提案した');},
  cmpAdd:()=>{if(!tmp)return;const ll=tmp.getLatLng(),r=pref(tmp._ref),c=cmpVal('cm'),nm=cmpVal('nm');dropTmp();closePop();
    if(r)return addCand(r.ref);const p={lat:+ll.lat.toFixed(5),lon:+ll.lng.toFixed(5)};
    edit(`寄り道${nm||c?'「'+(nm||c)+'」':''}を足した`,pl=>{const d=pl.days[S.day];d.stops.splice(bestIdx(d.stops,p),0,{id:'s'+uid(),name:nm||c||'寄り道',lat:p.lat,lon:p.lon,stay:30,kind:'via',ref:null,what:nm&&c?[c]:[]});});},
  vote:d=>{if(!S.me)return askName();const p=S.props.find(x=>x.id===d.id);if(p)PS.vote(p.id,!p.votes.includes(S.me));},
  adopt:d=>adopt(d.id),
  decline:d=>{PS.upd(d.id,{status:'declined'});closePop();},
  reopen:d=>PS.upd(d.id,{status:'open'}),
  pfocus:d=>{const p=S.props.find(x=>x.id===d.id);if(!p)return;const di=dayOfProp(p);if(di!==S.day)setDay(di);focusLL([p.lat,p.lon]);openPop([p.lat,p.lon],()=>propHTML(p.id),[9,-34]);}
};
function stopPop(j){const d=curDay(),s=d.stops[j];if(!s)return null;const sc=sched(d,S.mode),r=pref(s.ref);let h=stopRow(s,j,d.stops.length,sc,'p').replace(' data-a="focus"','');
  if(r){const o=r.o;h+=`<div class="acts">${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener">公式サイト</a>`:''}${o.tabelog_url?tbA(o):''}${o.fee?`<span class="mu">¥ ${esc(o.fee)}</span>`:''}</div>`;}
  return h;}
/* 確かめの画面（最初の計画に戻すとき） */
function askConfirm(msg,ok){const m=$('#modal');m.innerHTML=`<div class="mb" id="cfm"><p>${esc(msg)}</p><div><button data-a="cfmNo" style="flex:1">やめる</button><button class="pri" data-a="cfmOk" style="flex:1">戻す</button></div></div>`;m.classList.add('on');askConfirm.ok=ok;}
function resetPlan(){const mem=Object.assign({},S.plan.members);pause();closePop();
  edit('最初の計画に戻した',pl=>{pl.days=normPlan(initialPlan()).days;pl.members=mem;});
  if(S.store==='local'){try{localStorage.removeItem('tripA_plan');}catch(e){}}
  toast('↺ 最初の計画に戻した');}
function onAct(e){if(e.__h)return;e.__h=1;if(e.target.closest('a'))return;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset,b,e);}
document.addEventListener('click',onAct);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.c==='dep'){const v=t.value;if(/^\d{1,2}:\d{2}$/.test(v))edit(`${S.day+1}日目の出発を${v}に`,pl=>{pl.days[S.day].depart=v.padStart(5,'0');});}});
addEventListener('resize',()=>{chkNar();map.invalidateSize();setSheet(S.sv);renderTop();if(!S.um)fitDay(false);});
map.on('dragstart',()=>{S.um=1;});map.on('zoomend',()=>{if(!S.drag)drawStops();});
/* ---------- 見本（#demo=…）：保存しない ---------- */
function demo(){
  ['ゆうた','さくら','けんた'].forEach(n=>ensureMember(n));
  if(DEMO==='propose'||DEMO==='all'||DEMO==='adopt'){const ai=D.spots.findIndex(s=>s.trip_day===2&&s.optional&&s.lat!=null),bi=D.days[1].restaurants.find(i=>D.restaurants[i].lat!=null&&!inPlan('restaurants:'+i,1)),a=D.spots[ai],b=D.restaurants[bi],n=Date.now();
    S.props=[{id:'dp1',by:'さくら',color:colorOf('さくら'),lat:a.lat,lon:a.lon,name:a.name,comment:'ここ寄りたい',ref:'spots:'+ai,votes:['けんた'],status:'open',createdAt:n-5400e3,day:2},
      {id:'dp2',by:'けんた',color:colorOf('けんた'),lat:b.lat,lon:b.lon,name:b.name,comment:'この店がいい',ref:'restaurants:'+bi,votes:[],status:'open',createdAt:n-1800e3,day:2}];}
  if(DEMO==='adopt'||DEMO==='drag'||DEMO==='all'){S.day=1;const t0=S.tab;S.tab='plan';renderAll();S.tab=t0;}
  if(DEMO==='adopt'){adopt('dp1');}
  if(DEMO==='drag'||DEMO==='all'){edit('大歩危峡（遊覧船）を動かした',pl=>{const s=pl.days[1].stops[2];s.lat=33.9052;s.lon=133.7561;s.moved=true;},1);}
}
/* ---------- はじめ ---------- */
function start(){
  seedRC();if(!MEM)loadRC();
  INITS=normPlan(initialPlan()).days.map(d=>({highway:sched(d,'highway'),local:sched(d,'local')}));
  S.me=HS.get('me')||(MEM?'ゆうた':LS.get('me',''));
  if(S.store==='local'){loadLocal();S.ready=1;}else if(S.store==='mem')S.ready=1;
  if(S.store!=='fs')ensureMember();
  setSheet(S.sv);renderAll();setSheet(S.sv);TVR=true;
  if(MEM){demo();renderAll();}
  if(S.tab==='all')fitAll();else fitDay(false);
  if(S.store==='fs')fsInit().catch(fsFail);
  ensureRoutes();
  if(HS.has('t')){A.T=A.a+Math.max(0,Math.min(1,+HS.get('t')))*(A.b-A.a);paint();updPlay();}
  if(HS.has('at')){const j=+HS.get('at'),s=A.s[S.mode].stops[j];if(s){A.T=s.arr+Math.min(1,(s.dep-s.arr)/2);paint();updPlay();}}
  if(HS.get('play')==='1')play();
  const pp=HS.get('pop')||'';if(pp==='cmp')setTimeout(()=>ACT.newflag(),300);else if(/^s\d+$/.test(pp))setTimeout(()=>ACT.focus({j:pp.slice(1)}),300);else if(/^c/.test(pp))setTimeout(()=>ACT.cfocus({r:pp.slice(1)}),300);
  if(!S.me)askName();
}
if(window.L)start();else document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:40% 10px auto;text-align:center;z-index:3000">⚠ 地図を読み込めなかった</div>');
</script>
