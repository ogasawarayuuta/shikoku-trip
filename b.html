<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四国ドライブ 2027.3.8–3.11</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{
  --paper:#fbf8f1;--card:#fffdf8;--ink:#2a2824;--sub:#756e64;--faint:#a39b8f;--line:#e7e0d3;
  --ai:#27466f;--shu:#c8553d;--ok:#2f7a4c;--ng:#b3261e;--wa:#9a6200;--hl:#ffe377;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","BIZ UDPMincho",serif;
  --sans:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --hd:50px;--mapH:38vh;--strip:42px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column}
a{color:var(--ai)}
button{font:inherit;color:inherit;cursor:pointer}
.num,.tv{font-variant-numeric:tabular-nums}
/* ---------- fixed frame ---------- */
#hd{position:relative;flex:none;height:var(--hd);z-index:1200;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(251,248,241,.96);border-bottom:1px solid var(--line)}
#hd .ttl{flex:1;min-width:0;line-height:1.1;font-family:var(--serif);white-space:nowrap;overflow:hidden}
#hd .ttl b{display:block;font-size:16px;letter-spacing:.06em}
#hd .ttl span{font-size:11.5px;color:var(--sub);letter-spacing:.08em}
.seg{display:flex;border:1px solid #cfc6b6;border-radius:999px;padding:2px;background:#fff}
.seg button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid #cfc6b6;background:#fff;display:grid;place-items:center;font-size:18px;position:relative;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib i{position:absolute;right:-3px;top:-3px;font:600 10px/16px var(--sans);min-width:16px;height:16px;border-radius:8px;background:var(--shu);color:#fff;font-style:normal}
.ib i:empty{display:none}
#mapbox{position:relative;flex:none;height:var(--mapH);z-index:1000;background:#e9e4da}
#map{position:absolute;inset:0}
#msum{position:absolute;left:8px;bottom:22px;z-index:600;max-width:calc(100% - 64px);background:rgba(255,253,248,.93);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.45;box-shadow:0 2px 8px rgba(60,50,30,.12);pointer-events:none}
#msum b{font-family:var(--serif);font-size:13px}
#msum .w{color:var(--ng);font-weight:600}
#msum .busy{color:var(--ai)}
#mapbtns{position:absolute;right:8px;top:8px;z-index:600;display:flex;flex-direction:column;gap:6px}
#mapbtns .ib{width:34px;height:34px;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#strip{position:relative;flex:none;height:var(--strip);z-index:1100;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 3px 8px -6px rgba(60,50,30,.35)}
#chips{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap;color:var(--sub)}
.chip b{font-family:var(--serif);font-size:14px;color:var(--ink);margin-right:3px}
.chip[aria-current=true]{background:var(--dc,var(--ink));border-color:var(--dc,var(--ink));color:#fff}
.chip[aria-current=true] b{color:#fff}
.me{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px 2px 3px;font-size:12.5px;max-width:110px}
.me i{width:24px;height:24px;border-radius:50%;background:var(--pc,#999);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#book{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#book > *{max-width:720px;margin-left:auto;margin-right:auto}
@media (min-width:900px){
  :root{--mapW:56vw}
  body{display:grid;grid-template-columns:var(--mapW) minmax(0,1fr);grid-template-rows:var(--hd) var(--strip) minmax(0,1fr)}
  #hd{grid-column:1/3;grid-row:1}
  #mapbox{grid-column:1;grid-row:2/4;height:auto}
  #strip{grid-column:2;grid-row:2}
  #book{grid-column:2;grid-row:3;padding:0 24px}
  #book > *{max-width:640px}
  #hd .ttl b{font-size:18px;display:inline;margin-right:10px}
  #hd .ttl span{font-size:13px}
}
/* ---------- cover ---------- */
.cover{padding:26px 18px 30px;text-align:center;border-bottom:1px solid var(--line)}
.kick{font:12px/1 var(--serif);letter-spacing:.5em;color:var(--sub);margin-left:.5em}
.cover h1{font:600 34px/1.15 var(--serif);letter-spacing:.12em;margin:12px 0 4px}
.cover h1 span{display:block;font-size:19px;letter-spacing:.14em;margin-top:8px;color:var(--shu)}
.cover .sub{font-family:var(--serif);color:var(--sub);margin:8px 0 6px;font-size:14px}
.sig{display:block;width:100%;max-width:440px;height:auto;margin:8px auto 2px}
.sig text{font-family:var(--serif)}
.bands{margin:14px 0 0;text-align:left}
.band{display:block;width:100%;border:0;background:none;padding:9px 0 8px;border-top:1px dashed var(--line);text-align:left}
.band .bt{display:flex;gap:8px;align-items:baseline;font-size:13px}
.band .bt b{font:600 20px/1 var(--serif);color:var(--dc);min-width:16px}
.band .bt .bd{color:var(--sub);white-space:nowrap}
.band .bt .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif)}
.band svg{display:block;width:100%;height:30px;margin-top:4px}
.band .bs{font-size:12px;color:var(--sub)}
.band .bs b{color:var(--ink);font-weight:600}
.band .bs .w{color:var(--ng);font-weight:600}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);padding:0 0 0;margin-top:2px}
.lgd{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--sub);margin-top:8px}
.lgd i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--ink)}
.lgd i.s{background:repeating-linear-gradient(45deg,#c9c0b0 0 3px,#e9e3d7 3px 6px)}
.upd{font-size:12px;color:var(--sub);margin-top:12px}
.upd i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:4px}
/* ---------- day ---------- */
.day{padding:20px 14px 30px;border-bottom:1px solid var(--line);position:relative}
.dh{position:relative;padding:4px 2px 12px}
.dk{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);color:var(--dc)}
.dk .dn{font-size:48px;line-height:1;font-weight:600}
.dk .dl{font-size:14px;letter-spacing:.06em}
.dk .dd{margin-left:auto;font-size:18px;color:var(--ink)}
.dk .dd small{font-size:13px;color:var(--sub)}
.dh h2{font:600 21px/1.4 var(--serif);margin:6px 0 10px;letter-spacing:.03em}
.ds{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--sub)}
.ds b{font:600 17px/1 var(--serif);color:var(--ink)}
.dep{display:flex;align-items:center;gap:4px}
.dep input{font:600 17px/1 var(--serif);color:var(--ai);border:0;border-bottom:1.5px solid var(--ai);background:transparent;padding:1px 0;width:3.6em}
.dep input::-webkit-calendar-picker-indicator{display:none}
.dcmp{font-size:12.5px;color:var(--sub);margin-top:6px}
.dcmp .up{color:var(--ng);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.flag{font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid}
.flag.ng{color:var(--ng);border-color:#e7b3ae;background:#fff3f1}
.flag.wa{color:var(--wa);border-color:#e9cf9a;background:#fff8e8}
.flag.in{color:var(--ai);border-color:#b8c6dc;background:#f2f6fb}
.pt{margin:10px 0 0;font:14px/1.7 var(--serif);padding:8px 12px;background:#fff;border-left:3px solid var(--dc);border-radius:2px}
.lnote{font-size:12.5px;color:var(--ai);margin:8px 0 0}
/* timeline */
.tl{list-style:none;margin:10px 0 0;padding:0}
.b{display:grid;grid-template-columns:50px 28px minmax(0,1fr);column-gap:8px;position:relative}
.b .tc{text-align:right;padding-top:1px;white-space:nowrap}
.b .tc .tv{font:600 17px/1.3 var(--serif)}
.b .tc small{display:block;font-size:11px;color:var(--sub)}
.b .tc .tv s{display:block;margin:0;font-size:12px;line-height:1.1}
.sg .tv s{display:block;margin:0}
.b .nd{position:relative;display:flex;justify-content:center}
.b .nd::before{content:"";position:absolute;left:13px;width:2px;top:0;bottom:0;background:var(--dc)}
.b:first-child .nd::before{top:12px}
.b.nt .nd::before{bottom:auto;height:12px}
.b.dv .nd::before{background:repeating-linear-gradient(var(--dc) 0 5px,transparent 5px 10px);opacity:.75}
.pn{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--dc);display:grid;place-items:center;font:600 12px/1 var(--sans);color:var(--dc);margin-top:0}
.b.nt .pn{background:var(--dc);color:#fff}
.b .bd{padding-bottom:14px;min-width:0}
.b.dv{min-height:84px}
.b.dv .bd{display:flex;flex-direction:column;justify-content:center;padding:8px 0}
.dvl{font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.dvl svg{width:18px;height:18px;flex:none;color:var(--dc)}
.dvl .tv{font-weight:600}
.dvl .brk{font-size:12px;color:var(--sub)}
.rd{font-size:11.5px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagf{font-size:11.5px;border-radius:4px;padding:0 6px;border:1px solid #b8c6dc;color:var(--ai);background:#f2f6fb}
.tage{font-size:11.5px;border-radius:4px;padding:0 6px;border:1px solid #e9cf9a;color:var(--wa);background:#fff8e8}
.busy{font-size:12px;color:var(--ai)}
.busy::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:4px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nm{font:600 16.5px/1.4 var(--serif);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.byt{font:600 11px/1 var(--sans);color:#fff;background:var(--pc);border-radius:3px;padding:3px 6px}
.mvd{font:11px/1 var(--sans);color:var(--ai);border:1px dashed var(--ai);border-radius:3px;padding:2px 5px}
.sg{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px;flex-wrap:wrap}
.sg .sgl{color:var(--sub)}
.sg .sgt{font-weight:600}
.stay{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;margin-left:auto}
.stay button{border:0;background:none;width:30px;height:28px;font-size:16px;color:var(--ai);line-height:1}
.stay span{min-width:44px;text-align:center;font-size:12.5px;font-weight:600}
.tools{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.tools button{width:32px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--sub);font-size:14px;line-height:1}
.tools button:disabled{opacity:.3}
.ck{font-size:12.5px;margin-top:5px;padding:3px 8px;border-radius:4px;display:inline-block}
.ck.ok{color:var(--ok);background:#eff7f1}
.ck.ng{color:var(--ng);background:#fff0ee;font-weight:600}
.ck.wa{color:var(--wa);background:#fff7e6;font-weight:600}
.tv.chg{background:linear-gradient(transparent 52%,var(--hl) 52%);color:var(--shu);transition:background .8s}
.tv s{font-size:.72em;color:var(--faint);margin-right:4px;font-weight:400}
.tv.pend{opacity:.45;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;box-shadow:0 1px 0 rgba(60,50,30,.04)}
.card h4{font:600 16px/1.4 var(--serif);margin:3px 0 1px}
.cm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--sub)}
.cm .k{font:600 11px/1 var(--sans);color:#fff;background:var(--kc,#8a8378);border-radius:3px;padding:3px 6px}
.st{font-size:12px;font-weight:600;border-radius:3px;padding:1px 6px}
.st.ok{color:var(--ok);background:#eff7f1}.st.ng{color:var(--ng);background:#fff0ee}.st.q{color:var(--wa);background:#fff7e6}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0 4px;font-size:13px}
.card dt{color:var(--faint);font-size:12px;padding-top:1px}
.card dd{margin:0}
.why{font:13.5px/1.7 var(--serif);margin:6px 0 0}
.cn{font-size:12px;color:var(--sub);margin:4px 0 0}
.ar{font-size:12.5px;color:var(--sub)}
.ca{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.lk{font-size:13px;text-decoration:none;border:1px solid #b8c6dc;border-radius:6px;padding:4px 10px;background:#f6f8fc}
.lk::after,.ex::after{content:" ↗";font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",sans-serif;font-size:.9em}
.lk.tb{border-color:#e6c59a;background:#fff8ee;color:#8a4b00}
.act{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff}
.act.add{color:var(--ai);border-color:#b8c6dc}
.act.pr{color:var(--shu);border-color:#e8bfb4}
.inplan{font-size:12px;color:var(--ok)}
.sx{margin-top:22px}
.sx > h3{font:600 15px/1 var(--serif);letter-spacing:.25em;margin:0 0 4px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.sx > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:0 10px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
/* uzushio */
.uz{margin-top:8px;padding:8px 10px;border-radius:8px;background:#f2f6fb;border:1px solid #d5e0ee}
.uz .h{font:600 13px/1.3 var(--serif);color:var(--ai)}
.uz svg{display:block;width:100%;height:auto;margin-top:6px}
.uz details{font-size:12px;color:var(--sub);margin-top:4px}
.uz summary{cursor:pointer;color:var(--ai)}
.uz p{font-size:12px;color:var(--sub);margin:4px 0 0}
/* stickies */
.stk{display:flex;flex-wrap:wrap;gap:14px 12px;padding:12px 2px 4px}
.sticky{position:relative;width:calc(50% - 6px);min-height:128px;padding:16px 10px 8px;background:color-mix(in srgb,var(--pc) 16%,#fffdf3);box-shadow:0 3px 7px rgba(60,50,30,.16);border-radius:2px 2px 10px 2px;font-size:13px;transform:rotate(var(--rot,-1deg))}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:15px;margin-left:-23px;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.05);transform:rotate(-3deg)}
.sticky .sb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--pc);font-weight:600}
.sticky .sb i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.sticky .sn{font:600 14.5px/1.35 var(--serif);margin:4px 0 2px}
.sticky .sc{font:13.5px/1.5 var(--serif);color:#3d3a34}
.sticky .sa{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.sticky .sa button{font-size:12px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.7);border-radius:5px;padding:3px 7px}
.sticky .sa .vt[aria-pressed=true]{background:#fff;border-color:var(--pc);color:var(--pc);font-weight:600}
.sticky.adopted,.sticky.declined{opacity:.8}
.sticky.declined{filter:grayscale(.8);opacity:.6}
.stamp{position:absolute;right:10px;bottom:9px;font:700 15px/1 var(--serif);letter-spacing:.15em;border:2px solid;border-radius:4px;padding:4px 6px;transform:rotate(-12deg);opacity:.85}
.adopted .stamp{color:var(--shu)}
.declined .stamp{color:#666}
.sticky.new{display:grid;place-items:center;font-size:34px;color:var(--faint);background:transparent;border:2px dashed #d8d0c2;box-shadow:none;transform:none;min-height:128px}
.sticky.new::before{display:none}
/* lists */
.shun ul,.nts ul{list-style:none;margin:6px 0 0;padding:0}
.shun li{padding:8px 0;border-bottom:1px dotted var(--line);font-size:13px}
.shun li b{font:600 14.5px/1.4 var(--serif)}
.shun li .pf{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px}
.shun li p{margin:3px 0 0;color:#4d4840}
.shun li a{font-size:11.5px}
.nts li{position:relative;padding:6px 0 6px 22px;font-size:13px;border-bottom:1px dotted var(--line)}
.nts li::before{content:"！";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:#f3e4c4;color:var(--wa);font:700 11px/16px var(--sans);text-align:center}
.alt{margin-top:18px;border:1.5px solid var(--dc);border-radius:12px;padding:12px 14px;background:#fffaf0}
.alt .h{font:600 15px/1.4 var(--serif)}
.alt p{margin:4px 0;font-size:13px}
.alt svg{display:block;width:100%;height:auto;margin:6px 0}
.colo{padding:24px 18px 120px;font-size:12.5px;color:var(--sub)}
.colo h3{font:600 14px/1 var(--serif);letter-spacing:.25em;color:var(--ink)}
.colo p{margin:6px 0}
.colo .act{margin-top:10px}
/* map icons */
.bpin,.bcand,.bprop,.bcar{background:none;border:0}
.bpin i{position:absolute;left:7px;top:7px;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 12px/1 var(--sans);font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bpin.end i{background:var(--c);color:#fff}
.bpin.dragging i{transform:scale(1.25);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.bcand i{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.92);border:1.5px solid #8f877b;color:#5f584e;display:grid;place-items:center;font:600 10.5px/1 var(--serif);font-style:normal;opacity:.85}
.bprop i{position:absolute;left:5px;top:3px;width:26px;height:26px;background:var(--c);color:#fff;border-radius:3px 3px 3px 11px;display:grid;place-items:center;font:700 12px/1 var(--sans);font-style:normal;box-shadow:0 2px 5px rgba(0,0,0,.3);transform:rotate(-6deg)}
.bcar b{display:block;width:34px;height:34px;transform:rotate(var(--r,0deg));filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.bpop .leaflet-popup-content{margin:10px 12px;font:13px/1.5 var(--sans);min-width:190px}
.bpop .pt1{font:600 14.5px/1.35 var(--serif)}
.bpop .ps{font-size:12px;color:var(--sub);margin-top:2px}
.bpop .pb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bpop input{width:100%;font:14px var(--sans);padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.leaflet-container{font-family:var(--sans);background:#e9e4da}
.leaflet-tile-pane{filter:saturate(.42) sepia(.18) brightness(1.06) contrast(.92)}
.leaflet-control-attribution{font-size:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:3000;background:rgba(40,35,25,.38);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.shin{width:100%;max-width:480px;background:var(--paper);border-radius:16px 16px 0 0;padding:18px 18px 26px;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.shin .h{font:600 17px/1.3 var(--serif);display:flex;align-items:center;gap:8px}
.shin input,.shin select{width:100%;font:16px var(--sans);padding:9px 11px;border:1px solid #d5ccbb;border-radius:8px;background:#fff;margin-top:10px}

/* 車 */
function buildCarPath(){const pts=[],cum=[0],stopF=[0];let tot=0;const push=arr=>{arr.forEach(p=>{if(pts.length){tot+=hv2(pts[pts.length-1],p)}pts.push(p);cum.push(tot)})};
  const days=CUR===0?[0,1,2,3]:[CUR-1];const marks=[];
  days.forEach(d=>{const P=PLAN.days[d];if(!pts.length)push([[P.stops[0].lat,P.stops[0].lon]]);for(let i=1;i<P.stops.length;i++){push(legPts(P.stops[i-1],P.stops[i],MODE));marks.push(tot)}});
  cum.shift();CARP={pts,cum,tot,stopF:[0].concat(marks.map(m=>tot?m/tot:0))}}
function carAt(f){const P=CARP;if(!P||!P.pts.length)return null;const dist=Math.max(0,Math.min(1,f))*P.tot;let lo=0,hi=P.cum.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(P.cum[mid]<dist)lo=mid+1;else hi=mid}
  const j=Math.max(1,lo),a=P.pts[j-1]||P.pts[0],b=P.pts[j]||a,seg=P.cum[j]-P.cum[j-1]||1,u=Math.max(0,Math.min(1,(dist-P.cum[j-1])/seg));
  const lat=a[0]+(b[0]-a[0])*u,lon=a[1]+(b[1]-a[1])*u;let k=j,c=b;while(k<P.pts.length-1&&hv2(a,c)<.05){k++;c=P.pts[k]}
  const ang=Math.atan2((c[1]-a[1])*Math.cos(lat*R2),c[0]-a[0])/R2;return {lat,lon,ang}}
function placeCar(f){if(!carM)return;const p=carAt(f);if(!p)return;carM.setLatLng([p.lat,p.lon]);const el=carM.getElement();if(el){const b=el.firstChild;if(b&&isFinite(p.ang))b.style.setProperty('--r',p.ang.toFixed(1)+'deg')}}
let carRAF=0;function kickCar(){if(!carRAF&&!document.hidden)carRAF=requestAnimationFrame(stepCar)}
function stepCar(now){carRAF=0;if(document.hidden)return;let more=false;
  if(CAR.play){const u=(now-CAR.play.t0)/CAR.play.dur;if(u>=1){CAR.play=null;CAR.f=CAR.target}else{CAR.f=u<.5?2*u*u:1-(-2*u+2)**2/2;more=true}}
  else{const df=CAR.target-CAR.f;if(Math.abs(df)<.0004)CAR.f=CAR.target;else{CAR.f+=df*.16;more=true}}
  placeCar(CAR.f);if(more)carRAF=requestAnimationFrame(stepCar)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kickCar()});

/* ===================== スクロールと章 ===================== */
const BK=()=>$('#book');
function topH(){return BK().getBoundingClientRect().top}
function readY(){const r=BK().getBoundingClientRect();return r.top+r.height*.36}
function updateFromScroll(){const y=readY();let cur=0;for(let d=0;d<4;d++){const e=$('#day'+(d+1));if(e&&e.getBoundingClientRect().top<=y)cur=d+1}
  if(cur!==CUR){setCur(cur);CAR.f=CAR.target=cur?0:CAR.f}
  if(CUR>0&&!CAR.play)CAR.target=fracAt(CUR-1,y);kickCar()}
function fracAt(d,y){const sec=$('#day'+(d+1)),F=CARP?CARP.stopF:[0];let f=0;
  for(const b of $$('.tl > .b',sec)){const r=b.getBoundingClientRect(),i=+b.dataset.i;
    if(b.classList.contains('dv')){if(y<r.top)break;const p=Math.min(1,(y-r.top)/Math.max(1,r.height)),e=p*p*(3-2*p);f=(F[i-1]||0)+((F[i]||0)-(F[i-1]||0))*e;if(y<r.bottom)return f}
    else if(b.classList.contains('st')){if(y<r.top)break;f=F[i]||0}else if(b.classList.contains('nt')){if(y>=r.top)f=1}}
  return Math.max(0,Math.min(1,f))}
function scrollToEl(el,extra,instant){if(!el)return;const bk=BK(),y=el.getBoundingClientRect().top-topH()+bk.scrollTop-(extra==null?8:extra);bk.scrollTo({top:Math.max(0,y),behavior:READY&&!instant?'smooth':'auto'})}
function setCur(c){CUR=c;renderStrip();renderSum();drawMap()}
function scrollToFrac(d,t){const sec=$('#day'+(d+1));if(!sec)return;if(CUR!==d+1||!CARP)setCur(d+1);const G=CARP.stopF,bk=BK();let target=null;
  for(const b of $$('.tl > .b.dv',sec)){const i=+b.dataset.i;if(t>=G[i-1]&&t<=G[i]){const r=b.getBoundingClientRect(),u=(t-G[i-1])/Math.max(1e-9,G[i]-G[i-1]),p=.5-Math.sin(Math.asin(1-2*u)/3);target=r.top-topH()+bk.scrollTop+r.height*p;break}}
  if(target==null){scrollToEl(sec,8,true);return}bk.scrollTop=Math.max(0,target-(readY()-topH()))}

function applyPlan(doc){let p=doc&&doc.plan;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}if(!validPlan(p))return false;mergeLegc(p.legc);PLAN=p;META={updatedAt:doc.updatedAt||0,updatedBy:doc.updatedBy||''};return true}

  async init(){
    if(STORE==='memory')return;
    if(STORE==='local'){const v=lsGet(LSK.plan);if(v)applyPlan(v);const p=lsGet(LSK.props);if(Array.isArray(p))PROPS=p;
