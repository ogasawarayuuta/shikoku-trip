<style>

.pendl{animation:dsh 1s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-24}}

main{display:block}

.colh{display:flex;align-items:center;gap:6px;margin-bottom:4px}

.cd{position:relative;background:var(--p2);border-radius:6px;padding:5px 8px 6px 10px;border-left:3px solid #3a4a70}

.t2{font-size:12px;color:var(--mu);white-space:nowrap}
.mt{display:inline-block;font-size:10px;font-weight:900;font-style:normal;color:#06101f;padding:0 4px;margin-right:4px;transform:skewX(-10deg);line-height:15px}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:700;font-size:13px;line-height:1.35}

.kd{font-size:10px;font-weight:400;padding:0 4px;border:1px solid var(--ln);border-radius:3px;color:var(--mu)}
.bd{font-size:10px;font-weight:800;padding:0 5px;border-radius:3px;white-space:nowrap}

.bd.iq{background:rgba(255,255,255,.1);color:var(--tx)}
.wh,.hr,.cm{font-size:11px;color:var(--mu);margin-top:1px}
.cm{color:#d6def2}
.byl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu);margin-top:2px}

.ops{display:flex;gap:4px;align-items:center;margin-top:5px}

.ops .sp{flex:1}
.ops .del{color:var(--ng)}
.lg{position:relative;display:flex;flex-direction:column;gap:0;padding:3px 0 3px 16px;margin:0 0 0 6px;border-left:2px dotted #3a4a70;font-size:11px;color:var(--mu)}

.lg em.ap{color:var(--wn)}

.colf{margin-top:8px;padding-top:6px;border-top:1px solid var(--ln)}
.fr{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.fr b{font-size:20px;font-weight:900;font-style:italic}
.fr.o b{font-size:14px}
.fr small{font-size:10px;color:var(--mu)}
.fx{flex-basis:100%;font-size:10px;color:var(--mu);margin-top:-3px}
.wrn{display:block;width:100%;margin-top:6px;border:1px solid var(--wn);background:rgba(255,212,71,.08);color:var(--wn);border-radius:5px;padding:4px 6px;font-size:12px;font-weight:700;text-align:left}
.pl{display:grid;gap:8px}
.pc{position:relative;background:var(--p1);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:7px;padding:7px 10px}

.pch{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.pch b{color:var(--c);font-size:13px}
.pch .tgt{margin-left:auto}
.pcn{font-weight:800;font-size:14px;margin-top:1px}

.pcb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bt{height:32px;padding:0 11px;border-radius:5px;border:1px solid var(--ln);background:var(--p3);font-size:13px;font-weight:700;white-space:nowrap}

.bt.pr{background:var(--c);border-color:var(--c);color:#0a1224}
.bt.ng{color:var(--ng)}
.emp{font-size:12px;color:var(--mu);padding:10px;border:1px dashed var(--ln);border-radius:7px;text-align:center}
.cgp{font-size:11px;font-weight:800;color:var(--mu);margin:10px 0 4px}
.cc{background:var(--p1);border:1px solid var(--ln);border-radius:7px;padding:8px 10px;margin-bottom:8px}
.cch{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.cch b{font-size:14px}
.ccr{display:grid;grid-template-columns:38px 1fr;gap:6px;font-size:12px;margin-top:2px}

.ccw{font-size:12px;color:#d6def2;margin-top:4px}
.ccn{font-size:11px;color:var(--mu);margin-top:2px}

.ccl{display:flex;gap:12px;font-size:12px;margin-top:4px;flex-wrap:wrap}

<body>
<header id="hd">
  <div class="tt"><h1>四国ドライブ<b>2027.3.8–3.11</b></h1><div id="upd"></div></div>

function jdur(t){t=Math.round(Math.abs(t));const h=Math.floor(t/60),m=t%60;return h?h+'時間'+(m?m+'分':''):m+'分';}
function sdiff(t){const r=Math.round(t);return(r>0?'＋':r<0?'−':'±')+jdur(r);}
function fmtTs(ms){if(!ms)return'';const d=new Date(ms);return(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function tsOf(v){return typeof v==='number'?v:v&&typeof v.toMillis==='function'?v.toMillis():0;}
const short=s=>String(s||'').split('（')[0];
const md=i=>{const p=DAYS[i].date.split('-');return(+p[1])+'/'+(+p[2]);};
function newId(){return'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* フェリーの区間：データの線は間引かれているので、海の上の長い一直線（20km超）とその続きを渡船とみなす */
function ferryRanges(p){const n=p.length,sg=[];for(let i=0;i<n-1;i++)sg.push(hav2(p[i],p[i+1]));const out=[];let i=0;while(i<n-1){if(sg[i]>20){let a=i,b=i;while(a>0&&sg[a-1]>3)a--;while(b<n-2&&sg[b+1]>3)b++;out.push([a,b+1]);i=b+1;}else i++;}return out;}
function fromData(x){return{km:x.km,min:x.hours*60,f:!!x.ferry,fn:(x.ferries||[]).join('・'),path:x.path,fz:x.ferry?ferryRanges(x.path):[],src:'d'};}
const INIT={};
D.legs.forEach(l=>{INIT[keyOf(WP[l.from],WP[l.to])]={h:fromData(l.highway),l:fromData(l.local)};});
const RC=LS.get('rc',{})||{},TMP={},PEND={};

function approx1(a,b,m){const km=hav(a,b)*1.3;return{km,min:km/(m==='h'?80:35)*60,f:false,fn:'',path:null,fz:[],ap:true};}
function approxRec(a,b){return{h:approx1(a,b,'h'),l:approx1(a,b,'l')};}

/* ---------- 計画 ---------- */
function refObj(ref){if(!ref||typeof ref!=='string')return null;const t=ref[0],i=+ref.slice(1);const arr=t==='s'?D.spots:t==='r'?D.restaurants:t==='h'?D.hotels:null;if(!arr||!(i>=0)||!arr[i]||String(i)!==ref.slice(1))return null;return{t,i,o:arr[i]};}
const refDay=r=>r.t==='s'?r.o.trip_day:r.t==='r'?r.o.day:r.o.night;
const refKind=r=>r.t==='s'?'spot':r.t==='r'?'food':'hotel';
const defStay=r=>r.t==='s'?(r.o.stay_minutes||30):r.t==='r'?60:0;
function initialPlan(){return{v:'c1',days:DAYS.map(d=>({depart:d.depart,stops:d.plan_stops.map(s=>({id:s.id,name:s.name,lat:s.lat,lon:s.lon,stay:s.stay_min,kind:s.kind,what:(s.what||[]).slice(),ref:s.spot!=null?'s'+s.spot:null,by:null,bc:null}))})),legs:{}};}
function validPlan(p){if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){return null;}}if(!p||p.v!=='c1'||!Array.isArray(p.days)||p.days.length!==DAYS.length)return null;for(const d of p.days){if(!d||!Array.isArray(d.stops)||d.stops.length<2||!/^\d{1,2}:\d{2}$/.test(d.depart||''))return null;for(const s of d.stops)if(!s||!isFinite(s.lat)||!isFinite(s.lon))return null;}if(!p.legs||typeof p.legs!=='object')p.legs={};return p;}

let plan=initialPlan(),meta={by:'',at:0},props=[],me='',SEL=0,MODE='h',NET='';
const HIST=[];let DRAG=null,REMOTE=null,SCH=null,INIT_SCH=null;

function legFor(P,a,b){
  const k=keyOf(a,b);const r=INIT[k]||RC[k]||TMP[k];if(r)return r;
  need(k,a,b,false);
  const s=P.legs&&P.legs[k];
  if(s&&s.h&&s.l)return{h:Object.assign({path:null,fz:[]},s.h),l:Object.assign({path:null,fz:[]},s.l)};
  const ap=approxRec(a,b);ap.pend=true;return ap;
}
function legAt(P,di,i){
  const st=P.days[di].stops,a=st[i],b=st[i+1];
  if(DRAG&&P===plan&&DRAG.d===di&&DRAG.ll&&(DRAG.i===i||DRAG.i===i+1)){
    const o=legFor(P,a,b),na=DRAG.i===i?DRAG.ll:a,nb=DRAG.i===i+1?DRAG.ll:b,d0=hav(a,b),d1=hav(na,nb),out={prev:true,a:na,b:nb};
    for(const m of MODES){const L=o[m];out[m]=d0>0.3?{km:L.km*d1/d0,min:L.min*d1/d0,f:L.f,fn:L.fn,path:null,fz:[],ap:true}:approx1(na,nb,m);}
    return out;
  }
  return legFor(P,a,b);
}
function sched(P,di,m){
  const st=P.days[di].stops;let t=toMin(P.days[di].depart);
  const S={stops:st,arr:[],dep:[],legs:[],kmB:[],drive:0,km:0,ap:false,pend:false,f:false,fn:''};
  for(let i=0;i<st.length;i++){
    S.arr[i]=t;S.kmB[i]=S.km;t+=i===0?0:(+st[i].stay||0);S.dep[i]=t;
    if(i<st.length-1){
      const rec=legAt(P,di,i),L=rec[m],brk=Math.floor(L.min/120)*15;
      S.legs[i]={L,brk,t0:t,t1:t+L.min+brk,pend:!!rec.pend,prev:!!rec.prev,a:rec.a||st[i],b:rec.b||st[i+1]};
      t+=L.min+brk;S.drive+=L.min;S.km+=L.km;if(L.ap)S.ap=true;if(rec.pend)S.pend=true;if(L.f){S.f=true;if(L.fn)S.fn=L.fn;}
    }
  }
  S.end=S.dep[st.length-1];return S;
}
function calc(){SCH=plan.days.map((_,di)=>({h:sched(plan,di,'h'),l:sched(plan,di,'l')}));}

/* ---------- Valhalla ---------- */
const QUE=[];let qBusy=false;
function need(k,a,b,mine){if(NOFETCH){PEND[k]=PEND[k]||{mine:false};return;}if(PEND[k]){if(mine)PEND[k].mine=true;return;}PEND[k]={mine:!!mine};QUE.push({k,a:{lat:a.lat,lon:a.lon},b:{lat:b.lat,lon:b.lon}});setTimeout(pump,0);}
function claimMissing(){plan.days.forEach(d=>{for(let i=0;i<d.stops.length-1;i++){const a=d.stops[i],b=d.stops[i+1],k=keyOf(a,b);if(!INIT[k]&&!RC[k]&&!TMP[k])need(k,a,b,true);}});}
const summ=L=>({km:+L.km.toFixed(2),min:+L.min.toFixed(2),f:!!L.f,fn:L.fn||'',ap:!!L.ap});
async function pump(){
  if(qBusy)return;qBusy=true;
  try{while(QUE.length){
    const j=QUE.shift();const [h,l]=await Promise.all([route(j.a,j.b,'h'),route(j.a,j.b,'l')]);const rec={h,l};
    if(!h.ap&&!l.ap){RC[j.k]=rec;saveRC();}else TMP[j.k]=rec;
    const mine=PEND[j.k]&&PEND[j.k].mine;delete PEND[j.k];
    if(mine){plan.legs[j.k]={h:summ(h),l:summ(l)};savePlan();if(h.ap||l.ap)toast('道のりを取れず概算にしました');}
    if(!QUE.length)scheduleRender();
  }}finally{qBusy=false;}
}
function saveRC(){if(STORE==='mem')return;if(!LS.set('rc',RC)){const ks=Object.keys(RC);ks.slice(0,Math.ceil(ks.length/2)).forEach(k=>delete RC[k]);LS.set('rc',RC);}}
function decode6(s){let i=0,la=0,lo=0;const o=[];while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);la+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);lo+=(r&1)?~(r>>1):(r>>1);o.push([la/1e6,lo/1e6]);}return o;}
function simplify(p,fr,km){const th=Math.min(1.2,Math.max(0.03,km/700)),keep=new Set([0,p.length-1]);fr.forEach(([a,b])=>{keep.add(a);keep.add(b);});const out=[],mp=new Map();let last=null;for(let i=0;i<p.length;i++){if(keep.has(i)||!last||hav2(last,p[i])>=th){mp.set(i,out.length);out.push([r5(p[i][0]),r5(p[i][1])]);last=p[i];}}return{p:out,fz:fr.map(([a,b])=>[mp.get(a),mp.get(b)]).filter(x=>x[0]!=null&&x[1]!=null&&x[1]>x[0])};}
async function route(a,b,m){
  const co=m==='h'?{use_highways:1,use_tolls:1,use_ferry:0.5}:{use_highways:0,use_tolls:0,use_ferry:0.5};
  const body={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing:'auto',costing_options:{auto:co},units:'kilometers'};
  let to=0;
  try{
    const ctl=new AbortController();to=setTimeout(()=>ctl.abort(),25000);
    const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok)throw new Error('status');
    const j=await r.json(),s=j.trip.summary,lg=j.trip.legs[0],pts=decode6(lg.shape),fr=[];
    (lg.maneuvers||[]).forEach(v=>{if(v.type===28||v.travel_type==='ferry')fr.push([v.begin_shape_index,v.end_shape_index]);});
    const sp=simplify(pts,fr,s.length);let fz=sp.fz;if(s.has_ferry&&!fz.length)fz=ferryRanges(sp.p);
    return{km:s.length,min:s.time/60,f:!!s.has_ferry||fz.length>0,fn:'',path:sp.p,fz,src:'v'};
  }catch(e){return approx1(a,b,m);}finally{clearTimeout(to);}
}

/* ---------- 保存 ---------- */
let FS=null;
function prune(){const used={};plan.days.forEach(d=>{for(let i=0;i<d.stops.length-1;i++)used[keyOf(d.stops[i],d.stops[i+1])]=1;});Object.keys(plan.legs).forEach(k=>{if(!used[k])delete plan.legs[k];});}
function savePlan(){
  prune();meta={by:me,at:Date.now()};
  if(STORE==='local')LS.set('plan',{plan:JSON.stringify(plan),updatedAt:meta.at,updatedBy:me});
  else if(STORE==='fs'&&FS)FS.savePlan().catch(()=>toast('保存できませんでした'));
  renderHead();
}
function saveProps(){if(STORE==='local')LS.set('props',props);renderProps();drawProps();renderCands();}
const ST={
  add(o){if(STORE==='fs'){if(FS)FS.add(o).catch(()=>toast('送れませんでした'));return;}o.id=newId();props.push(o);saveProps();},
  upd(id,patch){if(STORE==='fs'){if(FS)FS.upd(id,patch).catch(()=>toast('保存できませんでした'));return;}const p=props.find(x=>x.id===id);if(p)Object.assign(p,patch);saveProps();},
  vote(id,on){if(STORE==='fs'){if(FS)FS.vote(id,on).catch(()=>toast('保存できませんでした'));return;}const p=props.find(x=>x.id===id);if(!p)return;p.votes=(p.votes||[]).filter(n=>n!==me);if(on)p.votes.push(me);saveProps();}
};
function loadLocal(){const rec=LS.get('plan',null);if(rec){const p=validPlan(rec.plan);if(p){plan=p;meta={by:rec.updatedBy||'',at:rec.updatedAt||0};}}const pr=LS.get('props',[]);props=Array.isArray(pr)?pr:[];}
async function initFS(){
  NET='wait';renderHead();
  try{
    const [A,F]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')]);
    const app=A.initializeApp(CFG),db=F.getFirestore(app),pref=F.doc(db,'trip_shikoku2027','plan'),CN='trip_shikoku2027_proposals',col=F.collection(db,CN);
    FS={
      savePlan:()=>F.setDoc(pref,{plan:JSON.stringify(plan),updatedAt:meta.at,updatedBy:meta.by}),
      add:o=>F.addDoc(col,o),
      upd:(id,p)=>F.updateDoc(F.doc(db,CN,id),p),
      vote:(id,on)=>F.updateDoc(F.doc(db,CN,id),{votes:on?F.arrayUnion(me):F.arrayRemove(me)})
    };
    F.onSnapshot(pref,snap=>{NET='ok';if(!snap.exists()){renderHead();return;}const v=snap.data(),p=validPlan(v.plan);if(!p){renderHead();return;}if(DRAG){REMOTE={p,v};return;}plan=p;meta={by:v.updatedBy||'',at:tsOf(v.updatedAt)};scheduleRender();},()=>{NET='err';renderHead();});
    F.onSnapshot(col,qs=>{props=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}));saveProps();},()=>{NET='err';renderHead();});
  }catch(e){NET='err';renderHead();}
}

/* ---------- 変更 ---------- */
function pushHist(x){HIST.push({p:JSON.stringify(plan),x:x||null});if(HIST.length>40)HIST.shift();}
function commit(fn,x){pushHist(x);fn();claimMissing();savePlan();renderAll();}
function undo(){const h=HIST.pop();if(!h)return;const p=validPlan(h.p);if(!p)return;plan=p;if(h.x)ST.upd(h.x.id,{status:h.x.status});savePlan();renderAll();toast('元に戻しました');}
function insertAt(di,p){const st=plan.days[di].stops;let best=1,bc=Infinity;for(let i=1;i<st.length;i++){const c=hav(st[i-1],p)+hav(p,st[i])-hav(st[i-1],st[i]);if(c<bc){bc=c;best=i;}}return{idx:best,cost:bc};}
function bestDay(p){let bd=SEL,bc=Infinity;plan.days.forEach((_,di)=>{const c=insertAt(di,p).cost;if(c<bc){bc=c;bd=di;}});return bd;}
function addStop(di,s){commit(()=>{const ix=insertAt(di,s).idx;plan.days[di].stops.splice(ix,0,Object.assign({id:newId(),what:[],by:me,bc:colorOf(me)},s));});if(di!==SEL)selectDay(di);toast((di+1)+'日目に入れました');}
function inPlan(ref){for(let di=0;di<plan.days.length;di++)if(plan.days[di].stops.some(s=>s.ref===ref))return di+1;return 0;}
function setHotel(r,by,bc,x){
  const di=r.o.night-1;if(!plan.days[di])return;
  commit(()=>{
    const st=plan.days[di].stops,end=st[st.length-1],hs={id:newId(),name:r.o.name,lat:r.o.lat,lon:r.o.lon,stay:0,kind:'end',what:[],ref:'h'+r.i,by,bc};
    if(end.stay>0||(end.what&&end.what.length)||(end.ref&&end.ref[0]!=='h')){const er=refObj(end.ref);end.kind=er?refKind(er):'pin';st.push(hs);}else st[st.length-1]=hs;
    const nx=plan.days[di+1];if(nx)nx.stops[0]=Object.assign({},nx.stops[0],{name:r.o.name,lat:r.o.lat,lon:r.o.lon,ref:'h'+r.i});
  },x);
  if(di!==SEL)selectDay(di);toast((di+1)+'日目の宿にしました');
}
function addRef(ref,by,bc,cm,x){
  const r=refObj(ref);if(!r||!isFinite(r.o.lat))return;
  if(r.t==='h')return setHotel(r,by,bc,x);
  const di=Math.min(plan.days.length,Math.max(1,refDay(r)))-1,st=plan.days[di].stops;
  /* 昼の店は、その日の「昼ごはん」の立ち寄り（店が決まっていない、または昼の店）を置き換える。0.8km 以内なら位置はそのまま */
  const lunch=r.t==='r'&&/^昼/.test(r.o.meal||'')?st.findIndex((s,j)=>{if(j===0||j===st.length-1||s.kind!=='food')return false;const q=refObj(s.ref);return!s.ref||(q&&q.t==='r'&&/^昼/.test(q.o.meal||''));}):-1;
  commit(()=>{
    if(lunch>0){const s=st[lunch];if(hav(s,r.o)>0.8){s.lat=r.o.lat;s.lon=r.o.lon;}Object.assign(s,{name:r.o.name,ref,by,bc,cm:cm||''});}
    else{const ix=insertAt(di,r.o).idx;st.splice(ix,0,{id:newId(),name:r.o.name,lat:r.o.lat,lon:r.o.lon,stay:defStay(r),kind:refKind(r),what:r.t==='r'&&r.o.meal?[r.o.meal]:[],ref,by,bc,cm:cm||''});}
  },x);
  if(di!==SEL)selectDay(di);toast(lunch>0?(di+1)+'日目の昼の店にしました':(di+1)+'日目に入れました');
}
function propDay(p){const r=refObj(p.ref);if(r&&isFinite(r.o.lat))return Math.min(4,Math.max(1,refDay(r)))-1;return bestDay({lat:+p.lat,lon:+p.lon});}
function adopt(id){
  const p=props.find(x=>x.id===id);if(!p||!isFinite(p.lat)||!isFinite(p.lon))return;
  const x={id,status:p.status||'open'},by=p.by||'',bc=p.color||colorOf(by),r=refObj(p.ref);
  if(r&&isFinite(r.o.lat))addRef(p.ref,by,bc,p.comment,x);
  else{const di=propDay(p);commit(()=>{const ix=insertAt(di,{lat:+p.lat,lon:+p.lon}).idx;plan.days[di].stops.splice(ix,0,{id:newId(),name:p.name||'地図の地点',lat:+p.lat,lon:+p.lon,stay:30,kind:'pin',what:[],ref:null,by,bc,cm:p.comment||''});},x);if(di!==SEL)selectDay(di);toast((di+1)+'日目に入れました');}
  ST.upd(id,{status:'adopted'});
}

/* ---------- 地図 ---------- */
let map,G={},CARS={},LEGL={},PV=[];
function stopIcon(s,i,n){const lab=i===0?'発':i===n-1?'着':String(i);return L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],html:'<div class="pin'+(i===0||i===n-1?' se':'')+'"'+(s.by?' style="--c:'+esc(s.bc||colorOf(s.by))+'"':'')+'><b>'+lab+'</b></div>'});}
function carIcon(m,cls){return L.divIcon({className:'',iconSize:[12,12],iconAnchor:[6,6],html:'<div class="car '+m+' '+cls+'" style="--c:'+MC[m]+'"><span>'+(cls==='fy'?'⛴ ':cls==='gl'?'✓ ':'')+MN[m]+'</span></div>'});}
function initMap(){
  map=L.map('map',{zoomControl:false,keyboard:false,attributionControl:true,zoomSnap:0.5}).setView([34.6,135.8],6);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  ['oth','rt','pv','cd','pp','st'].forEach(k=>G[k]=L.layerGroup().addTo(map));
  MODES.forEach(m=>{CARS[m]=L.marker([34,134],{icon:carIcon(m,''),interactive:false,keyboard:false,zIndexOffset:3000}).addTo(map);CARS[m]._c='';});
  map.on('click',e=>openHere(e.latlng));
}
function runs(p,fz){if(!fz||!fz.length)return[{p,f:false}];const o=[];let s=0;for(const [a,b] of fz){if(a>s)o.push({p:p.slice(s,a+1),f:false});o.push({p:p.slice(a,b+1),f:true});s=b;}if(s<p.length-1)o.push({p:p.slice(s),f:false});return o;}
function drawLeg(g,m,i,tip){
  const prim=m===MODE,c=MC[m],ls=(LEGL[i]=LEGL[i]||[]),add=l=>{l.addTo(G.rt);ls.push(l);return l;},ab=[[g.a.lat,g.a.lon],[g.b.lat,g.b.lon]];
  if(g.pend){if(m==='h')add(L.polyline(ab,{color:'#ffd447',weight:3,dashArray:'6 6',className:'pendl',interactive:false})).bindTooltip('計算中…',{permanent:true,direction:'center',className:'tt pd'});return;}
  if(!g.L.path){const l=add(L.polyline(ab,{color:c,weight:prim?4:3,dashArray:'7 6',opacity:prim?1:.7,interactive:false}));if(g.L.ap&&prim)l.bindTooltip('概算',{permanent:true,direction:'center',className:'tt pd'});return;}
  for(const r of runs(g.L.path,g.L.fz)){
    if(r.f){const l=add(L.polyline(r.p,{color:'#2ee6c5',weight:4,dashArray:'1 8',lineCap:'round',interactive:false}));if(!tip.f){tip.f=1;l.bindTooltip('⛴ '+(g.L.fn||'フェリー'),{permanent:true,direction:'center',className:'tt fy'});}}
    else{add(L.polyline(r.p,{color:c,weight:prim?6:4,opacity:prim?1:.72,interactive:false}));if(m==='h')add(L.polyline(r.p,{color:'#eaf5ff',weight:1.3,opacity:prim?.85:.5,interactive:false}));}
  }
}
function drawMap(){
  G.rt.clearLayers();G.st.clearLayers();G.oth.clearLayers();G.pv.clearLayers();LEGL={};PV=[];
  plan.days.forEach((d,di)=>{if(di===SEL)return;SCH[di][MODE].legs.forEach(g=>{L.polyline(g.L.path||[[g.a.lat,g.a.lon],[g.b.lat,g.b.lon]],{color:'#8b9bc2',weight:2.5,opacity:.4,bubblingMouseEvents:false}).on('click',()=>selectDay(di)).addTo(G.oth);});});
  const tip={};(MODE==='h'?['l','h']:['h','l']).forEach(m=>SCH[SEL][m].legs.forEach((g,i)=>drawLeg(g,m,i,tip)));
  const st=plan.days[SEL].stops;
  st.forEach((s,i)=>{

function span(){return{a:toMin(plan.days[SEL].depart),b:Math.max(SCH[SEL].h.end,SCH[SEL].l.end)};}
const CUM=new WeakMap();
function cumOf(p){let c=CUM.get(p);if(c)return c;c=new Float64Array(p.length);for(let i=1;i<p.length;i++)c[i]=c[i-1]+hav2(p[i-1],p[i]);CUM.set(p,c);return c;}

function carState(S,T){
  const st=S.stops,n=st.length;
  for(let i=0;i<n;i++){
    if(i===0?T<=S.dep[0]:T<S.dep[i])return{ll:[st[i].lat,st[i].lon],s:i===0?'wait':'stay',i,km:S.kmB[i]};
    if(i===n-1)return{ll:[st[i].lat,st[i].lon],s:'goal',i,km:S.km};
    const g=S.legs[i];
    if(T<g.t1){
      const e=T-g.t0,nb=g.brk/15,k=Math.floor(e/135);let dv,rest=false;
      if(k<nb){const w=e-k*135;dv=k*120+Math.min(w,120);rest=w>120;}else dv=nb*120+(e-nb*135);
      const f=g.L.min>0?Math.min(1,Math.max(0,dv/g.L.min)):1;let ll,fy=false;
      if(g.L.path&&g.L.path.length>1){const q=along(g.L.path,f);ll=q.ll;fy=(g.L.fz||[]).some(([x,y])=>q.j>=x&&q.j<y);}
      else ll=[g.a.lat+(g.b.lat-g.a.lat)*f,g.a.lon+(g.b.lon-g.a.lon)*f];
      return{ll,s:fy?'ferry':rest?'rest':'drive',i,km:S.kmB[i]+g.L.km*f};
    }
  }
  return{ll:[st[n-1].lat,st[n-1].lon],s:'goal',i:n-1,km:S.km};
}

  if(p.comment)h+='<div class="pcc">「'+esc(p.comment)+'」</div>';
  h+='<div class="pcb"><button class="bt'+(mine?' on':'')+'" data-act="vote">👍 '+v.length+'</button>';
  if(st==='open')h+='<button class="bt ad" data-act="adopt">採用 → '+(di+1)+'日目</button><button class="bt" data-act="decline">見送り</button><button class="bt" data-act="pfocus" aria-label="地図で見る">📍</button>';
  else if(st==='declined')h+='<button class="bt" data-act="reopen">戻す</button>';
  return h+'</div>'+(v.length?'<div class="byl">'+v.map(n=>'<i style="background:'+colorOf(n)+'"></i>'+esc(n)).join(' ')+'</div>':'')+'</div>';
}
function renderProps(){
  const box=$('#props');const o={open:0,adopted:1,declined:2};
  const list=props.filter(p=>p&&p.id).slice().sort((a,b)=>(o[a.status||'open']||0)-(o[b.status||'open']||0)||((b.votes||[]).length-(a.votes||[]).length)||(tsOf(b.createdAt)-tsOf(a.createdAt)));
  box.innerHTML=list.length?list.map(propHTML).join(''):'<div class="emp">提案はまだありません</div>';
}
function candHTML(ref,pop,lite){
  const r=refObj(ref);if(!r)return'';const o=r.o,ip=inPlan(ref),k=refKind(r),has=isFinite(o.lat)&&isFinite(o.lon);
  const row=(a,b)=>b?'<div class="ccr"><span>'+a+'</span><span>'+esc(b)+'</span></div>':'';
  let h='<div class="cc" data-ref="'+ref+'"><div class="cch"><span class="kd">'+(r.t==='r'?esc(o.meal||'ごはん'):KIND[k])+'</span><b>'+esc(o.name)+'</b>'+openBadge(o)+(ip?'<span class="bd iq">✓ '+ip+'日目</span>':'')+'</div>';
  if(r.t==='s'){h+=row('時間',o.hours_march)+row('定休',o.closed)+row('料金',o.fee)+row('滞在',o.stay_minutes?o.stay_minutes+'分':'');}
  else if(r.t==='r'){h+=row('料理',o.genre)+row('場所',o.area)+row('時間',o.hours)+row('定休',o.closed)+row('予算',o.price)+row('駐車',o.parking);}
  else{h+=row('場所',o.area)+row('種類',o.type);}
  if(!lite){if(o.why)h+='<div class="ccw">'+esc(o.why)+'</div>';if(o.note||o.address)h+='<details class="ccd"><summary>詳しく</summary>'+(o.note?'<div class="ccn">'+esc(o.note)+'</div>':'')+(o.address?'<div class="ccn">'+esc(o.address)+'</div>':'')+'</details>';}
  h+='<div class="ccl">'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener">公式サイト ↗</a>':'')+(o.tabelog_url?'<a href="'+esc(o.tabelog_url)+'" target="_blank" rel="noopener">食べログ ↗</a>':'')+'</div>';
  if(!lite){
    h+='<div class="ccb">';
    if(!has)h+='<span class="bd iq">地図の位置なし</span>';
    else{const day=Math.min(4,Math.max(1,refDay(r)));
      if(r.t==='h')h+='<button class="bt ad" data-act="hotel"'+(ip?' disabled':'')+'>宿にする（'+day+'日目の夜）</button>';
      else h+='<button class="bt ad" data-act="add-ref"'+(ip?' disabled':'')+'>＋ '+day+'日目に足す</button>';
      h+='<button class="bt pr" data-act="prop-open" style="--c:'+colorOf(me)+'">提案</button>';}
    h+='</div><div class="ccf"><input class="in" name="cm" maxlength="80" placeholder="ひと言"><button class="bt pr" data-act="prop-ref" style="--c:'+colorOf(me)+'">送る</button></div>';
  }
  return h+'</div>';

function renderCands(){
  const day=SEL+1,box=$('#cands');$('#candh').firstChild.textContent=day+'日目の候補';
  const grp=(t,arr,f,label)=>{const ix=arr.map((o,i)=>i).filter(i=>f(arr[i]));return ix.length?'<div class="cgp">'+label+'</div>'+ix.map(i=>candHTML(t+i)).join(''):'';};
  box.innerHTML=grp('s',D.spots,o=>o.trip_day===day,'観光')+grp('r',D.restaurants,o=>o.day===day,'ごはん')+grp('h',D.hotels,o=>o.night===day,'宿')+'<p class="fnote">'+esc(D.tabelog_note)+'</p>';
}
/* 注意書きを日に割り当てる：「N日目」と書いてあればその日、なければその日の地名・店名・日付が出てくる日、どれにも当たらなければ全体 */
let NOTE_DAY=null;
function noteDays(){
  if(NOTE_DAY)return NOTE_DAY;
  const SKIP={'本店':1,'郷土料理':1,'レストラン':1,'特別名勝':1,'ホテル':1};
  const tok=s=>String(s||'').split(/[（(]/)[0].split(/[\s・／/]+/).filter(t=>t.length>=2&&!SKIP[t]);
  const kw=DAYS.map((d,i)=>{const w=new Set([md(i)]),add=s=>tok(s).forEach(t=>w.add(t));
    d.plan_stops.forEach((s,j)=>{if(j>0){add(s.name);(s.what||[]).forEach(add);}});
    D.spots.forEach(o=>{if(o.trip_day===i+1)add(o.name);});D.restaurants.forEach(o=>{if(o.day===i+1)add(o.name);});D.hotels.forEach(o=>{if(o.night===i+1)add(o.name);});return[...w];});
  NOTE_DAY=(D.notes||[]).map(n=>{n=String(n);const ex=[];n.replace(/([1-9])日目/g,(_,k)=>{if(+k<=DAYS.length&&ex.indexOf(+k)<0)ex.push(+k);});if(ex.length)return ex;
    const hit=[];kw.forEach((w,i)=>{if(w.some(t=>n.indexOf(t)>=0))hit.push(i+1);});return hit.length?hit:[0];});
  return NOTE_DAY;
}
function renderInfo(){
  const NOTE_DAY=noteDays();
  const day=SEL+1,S=SCH[SEL];let h='';$('#infoh').firstChild.textContent=day+'日目のメモ';
  const u=D.uzushio;
  if(u&&DAYS[SEL].date===u.date)h+='<div class="ib2"><h3>渦潮の見ごろ '+md(SEL)+'</h3><p class="big">'+esc(String(u.best_times).split('→').pop().trim())+'</p><p>'+esc(u.best_times)+'</p><p class="fnote">'+esc(u.note)+' <a href="'+esc(u.source_url)+'" target="_blank" rel="noopener">潮見表 ↗</a></p></div>';
  const prefs=[...new Set((DAYS[SEL].spots||[]).map(i=>D.spots[i]&&D.spots[i].pref).filter(Boolean))],sz=(D.seasonal||[]).filter(s=>prefs.indexOf(s.pref)>=0);
  if(sz.length)h+='<div class="ib2"><h3>3月の旬（'+prefs.join('・')+'）</h3><div class="szn">'+sz.map(s=>'<div><b>'+esc(s.item)+'</b>'+esc(s.note)+' <a href="'+esc(s.source_url)+'" target="_blank" rel="noopener">出典 ↗</a></div>').join('')+'</div></div>';
  const nt=(D.notes||[]).filter((n,i)=>{const d=NOTE_DAY[i];return d?d.indexOf(day)>=0:false;}),gn=(D.notes||[]).filter((n,i)=>NOTE_DAY[i]&&NOTE_DAY[i][0]===0);
  if(S.l.f&&D.local_note)nt.unshift(D.local_note);
  if(nt.length)h+='<div class="ib2"><h3>⚠ 注意</h3><ul>'+nt.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  const a=D.alt_plan;
  if(a&&day===DAYS.length){const n=a.now,al=a.alt,mx=Math.max(n.day3_drive_hours,n.day4_drive_hours,al.day3_drive_hours,al.day4_drive_hours),bar=(v,c)=>'<div class="abr"><i class="'+c+'" style="width:'+(v/mx*70).toFixed(1)+'%"></i><span>'+jdur(v*60)+'</span></div>';
    h+='<div class="ib2" id="altb"><h3>⚠ 帰りが遅い：'+esc(a.title)+'</h3><p>'+esc(a.why)+'（今の計画の帰着 '+esc(n.day4_home)+'）</p><div class="cl"><span><i class="sw" style="background:#7d8db3"></i>今の計画</span><span><i class="sw" style="background:var(--wn)"></i>代わりの案</span><span>運転時間</span></div>'+
    '<div class="ab"><span>3日目</span><div>'+bar(n.day3_drive_hours,'')+bar(al.day3_drive_hours,'a')+'</div><span>4日目</span><div>'+bar(n.day4_drive_hours,'')+bar(al.day4_drive_hours,'a')+'</div></div><p class="fnote">'+esc(a.tradeoff)+'</p></div>';}
  if(gn.length)h+='<div class="ib2"><h3>4日間共通</h3><ul>'+gn.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  $('#info').innerHTML=h;
}
function renderAll(){calc();renderHead();renderTabs();drawMap();renderScore();renderTL();renderCmp();renderBoard();renderProps();renderCands();renderInfo();drawCands();drawProps();raceDraw();}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(DRAG)return;renderAll();});}
function selectDay(di){if(di===SEL&&SCH)return;SEL=di;R.T=null;R.play=false;map.closePopup();renderAll();fitDay();const c=$('#board .col[data-d="'+di+'"]');if(c)$('#board').scrollTo({left:c.offsetLeft-12,behavior:'smooth'});}
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);}

/* ---------- 操作 ---------- */
function needMe(){if(me)return true;openDlg();return false;}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  const cd=b.closest('.cd'),di=cd?+cd.dataset.d:SEL,i=cd?+cd.dataset.i:-1,pc=b.closest('[data-id]'),id=pc?pc.dataset.id:null,cc=b.closest('[data-ref]'),ref=cc?cc.dataset.ref:null,pw=b.closest('.pw');
  switch(a){
    case'day':selectDay(+b.dataset.d);break;
    case'mode':MODE=b.dataset.m;renderAll();break;
    case'play':play();break;
    case'undo':undo();break;
    case'me':openDlg();break;
    case'alt':{const el=$('#altb');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});else{selectDay(DAYS.length-1);setTimeout(()=>{const x=$('#altb');if(x)x.scrollIntoView({behavior:'smooth',block:'center'});},50);}break;}
    case'stay':commit(()=>{const s=plan.days[di].stops[i];s.stay=Math.max(0,Math.min(720,(+s.stay||0)+(+b.dataset.v)));});map.closePopup();break;
    case'mv':{const j=i+(+b.dataset.v),st=plan.days[di].stops;if(j<1||j>st.length-2)break;commit(()=>{const t=st[i];st[i]=st[j];st[j]=t;});break;}
    case'del':commit(()=>{plan.days[di].stops.splice(i,1);});toast('外しました');break;
    case'focus':{const s=plan.days[di].stops[i];if(di!==SEL)selectDay(di);map.setView([s.lat,s.lon],Math.max(map.getZoom(),11));openStop(di,i);if($('#mapwrap').getBoundingClientRect().bottom<160)window.scrollTo({top:0,behavior:'smooth'});break;}
    case'add-here':{if(!needMe())break;const nm=pw.querySelector('[name=nm]').value.trim(),cm=pw.querySelector('[name=cm]').value.trim();map.closePopup();addStop(SEL,{name:nm||'地図の地点',lat:r5(+pw.dataset.lat),lon:r5(+pw.dataset.lon),stay:30,kind:'pin',ref:null,cm});break;}
    case'prop-here':{if(!needMe())break;const nm=pw.querySelector('[name=nm]').value.trim(),cm=pw.querySelector('[name=cm]').value.trim();map.closePopup();ST.add({by:me,color:colorOf(me),lat:r5(+pw.dataset.lat),lon:r5(+pw.dataset.lon),name:nm||'地図の地点',comment:cm,ref:null,votes:[],status:'open',createdAt:Date.now()});toast('提案しました');break;}
    case'add-ref':if(!needMe())break;map.closePopup();addRef(ref,me,colorOf(me),'');break;
    case'hotel':{if(!needMe())break;map.closePopup();const r=refObj(ref);if(r)setHotel(r,me,colorOf(me));break;}
    case'prop-open':cc.classList.toggle('pf');{const f=cc.querySelector('[name=cm]');if(f&&cc.classList.contains('pf'))f.focus();}break;
    case'prop-ref':{if(!needMe())break;const r=refObj(ref);if(!r)break;const cm=cc.querySelector('[name=cm]').value.trim();map.closePopup();ST.add({by:me,color:colorOf(me),lat:r.o.lat,lon:r.o.lon,name:r.o.name,comment:cm,ref,votes:[],status:'open',createdAt:Date.now()});toast('提案しました');break;}
    case'vote':{if(!needMe()||!id)break;const p=props.find(x=>x.id===id);if(p)ST.vote(id,(p.votes||[]).indexOf(me)<0);break;}
    case'adopt':if(!needMe()||!id)break;map.closePopup();adopt(id);break;
    case'decline':if(!needMe()||!id)break;map.closePopup();ST.upd(id,{status:'declined'});break;
    case'reopen':if(!needMe()||!id)break;ST.upd(id,{status:'open'});break;
    case'pfocus':{const p=props.find(x=>x.id===id);if(p){map.setView([+p.lat,+p.lon],Math.max(map.getZoom(),11));openProp(id);window.scrollTo({top:0,behavior:'smooth'});}break;}
  }
});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('depi')){const di=+t.dataset.d,v=t.value;if(!/^\d{2}:\d{2}$/.test(v))return;commit(()=>{plan.days[di].depart=v;});}});
function openDlg(){const d=$('#dlg');d.hidden=false;const n=$('#dlgn');n.value=me||'';dlgPrev();setTimeout(()=>n.focus(),30);}
function dlgPrev(){const v=$('#dlgn').value.trim(),c=$('#dlgc');c.style.setProperty('--c',colorOf(v));c.lastChild.textContent=v;c.firstChild.style.visibility=v?'visible':'hidden';}
$('#dlgn').addEventListener('input',dlgPrev);
$('#dlgf').addEventListener('submit',e=>{e.preventDefault();const v=$('#dlgn').value.trim().slice(0,12);if(!v)return;me=v;if(STORE!=='mem')LS.set('me',me);$('#dlg').hidden=true;renderAll();});
(function(){const tl=$('#tl');let dn=false;const set=e=>{const r=tl.getBoundingClientRect(),{a,b}=span();R.T=a+(b-a)*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));R.play=false;raceDraw();};
  tl.addEventListener('pointerdown',e=>{dn=true;tl.setPointerCapture(e.pointerId);set(e);});tl.addEventListener('pointermove',e=>{if(dn)set(e);});tl.addEventListener('pointerup',()=>{dn=false;});tl.addEventListener('pointercancel',()=>{dn=false;});})();
window.addEventListener('storage',e=>{if(STORE!=='local')return;if(e.key===PFX+'plan'||e.key===PFX+'props'){loadLocal();renderAll();}});
document.addEventListener('visibilitychange',resume);

/* ---------- はじめ ---------- */
function demo(){
  if(DEMO==='drag'||DEMO==='pending'){SEL=1;pushHist();const s=plan.days[1].stops[2];s.lat=33.925;s.lon=133.755;s.mv=me;meta={by:me,at:Date.now()};claimMissing();}
  if(DEMO==='propose'||DEMO==='adopt'){const t=Date.now(),si=D.spots.findIndex(o=>o.trip_day===2&&o.optional&&isFinite(o.lat)),ri=D.restaurants.findIndex(o=>o.day===2&&/夜/.test(o.meal||'')),S1=D.spots[si],R1=D.restaurants[ri];props=[];
    if(S1)props.push({id:'dm1',by:'Bさん',color:colorOf('Bさん'),lat:S1.lat,lon:S1.lon,name:S1.name,comment:'ここも寄りたい',ref:'s'+si,votes:['Aさん','Cさん'],status:'open',createdAt:t-5400e3});
    if(R1)props.push({id:'dm2',by:'Cさん',color:colorOf('Cさん'),lat:R1.lat,lon:R1.lon,name:R1.name,comment:'夜はこの店がいい',ref:'r'+ri,votes:[],status:'open',createdAt:t-1800e3});SEL=1;}
}
function boot(){
  me=HS.get('me')||(DEMO?'Aさん':LS.get('me',''))||'';
  SEL=Math.min(DAYS.length,Math.max(1,parseInt(HS.get('day'),10)||1))-1;MODE=HS.get('mode')==='local'?'l':'h';
  if(STORE==='local')loadLocal();
  const ip=initialPlan();INIT_SCH=ip.days.map((_,di)=>({h:sched(ip,di,'h'),l:sched(ip,di,'l')}));
  initMap();
  if(DEMO)demo();
  if(HS.get('day'))SEL=Math.min(DAYS.length,Math.max(1,parseInt(HS.get('day'),10)||1))-1;
  calc();if(DEMO==='adopt')adopt('dm1');
  renderAll();fitDay();
  const t=parseFloat(HS.get('t'));if(isFinite(t)){const {a,b}=span();R.T=a+(b-a)*Math.min(1,Math.max(0,t));raceDraw();}
  if(HS.get('play')==='1')play();
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{R.vis=es[0].isIntersecting;resume();}).observe($('#mapwrap'));
  if(!me)openDlg();
  if(STORE==='fs')initFS();
  setTimeout(()=>{const c=$('#board .col[data-d="'+SEL+'"]');if(c)$('#board').scrollLeft=c.offsetLeft-12;},0);
    if(HS.get('at'))setTimeout(()=>{const el=document.getElementById(HS.get('at'));if(el)window.scrollTo(0,el.getBoundingClientRect().top+scrollY-98);},300);
  }
boot();
})();
